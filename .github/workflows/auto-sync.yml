name: Auto sync from upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Backup wrangler.toml
        run: |
          if [ -f wrangler.toml ]; then
            cp wrangler.toml wrangler.toml.backup
          fi

      - name: Sync upstream using merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/jhk5263/edgetunnel.git
          git fetch upstream

          DEFAULT_BRANCH=$(git remote show upstream | grep 'HEAD branch' | cut -d' ' -f5)

          # 关键：用 merge 而不是 reset --hard
          # 这样可以保留本地的工作流文件，不会覆盖自己
          git merge upstream/$DEFAULT_BRANCH --no-edit --allow-unrelated-histories || echo "Merge conflict, skipping"

          # 如果 merge 有冲突，优先保留本地版本
          git checkout --ours .github/workflows/auto-sync.yml 2>/dev/null || true

          # 恢复 wrangler.toml
          if [ -f wrangler.toml.backup ]; then
            mv wrangler.toml.backup wrangler.toml
          fi

          git add .
          git commit -m "Sync upstream changes" --no-verify || echo "No changes to commit"
          git push origin $DEFAULT_BRANCH
